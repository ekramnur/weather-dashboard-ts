 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-sky-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-2xl">

    <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
      Weather Dashboard
    </h1>

    <div class="flex gap-3 mb-6">

      <input
        id="cityInput"
        type="text"
        placeholder="Enter a city..."
        class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button
        id="searchBtn"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg"
      >
        Search
      </button>

    </div>

    
<p id="status" class="text-center text-gray-600 mb-6">
  Search for a city to begin.
</p>

<div id="currentWeather" class="hidden bg-blue-50 rounded-lg p-6 mb-6">

  <h2 id="cityName" class="text-2xl font-bold"></h2>

  <p id="temperature" class="text-5xl font-bold text-blue-600 mt-2"></p>

  <p id="weatherDescription" class="mt-2 text-gray-700"></p>

  <p id="windSpeed" class="mt-2 text-gray-700"></p>

</div>

<div
  id="forecast"
  class="grid grid-cols-1 md:grid-cols-5 gap-4"
>


  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
